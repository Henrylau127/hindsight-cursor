# Fast pull request checks. Image build and GHCR publish stay in Weekly Docker CI,
# which runs on schedule and workflow_dispatch only.

name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run ShellCheck
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(scripts/**/*.sh)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts matched scripts/**/*.sh"
            exit 1
          fi
          shellcheck -x "${files[@]}"

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          version=1.7.12
          install_dir="$(mktemp -d)"
          curl -fsSL -o "${install_dir}/download-actionlint.bash" \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${version}/scripts/download-actionlint.bash"
          bash "${install_dir}/download-actionlint.bash" "${version}" "${install_dir}"
          "${install_dir}/actionlint" -version
          "${install_dir}/actionlint" -color

  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: info
